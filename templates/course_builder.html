<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Builder - SkillPro Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen relative">
    <!-- Toast Notification Overlay -->
    <div
      id="toast"
      class="fixed top-5 right-5 z-50 hidden transition-all transform translate-y-[-10px] duration-300"
    >
      <div
        id="toast-body"
        class="px-5 py-3 rounded-xl font-medium text-sm text-white shadow-xl flex items-center gap-3"
      >
        <span id="toast-message">Notification message</span>
      </div>
    </div>

    <nav
      class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md px-8 py-4 flex justify-between items-center"
    >
      <a
        href="/dashboard/instructor"
        class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent"
        >SkillPro Studio</a
      >
      <a
        href="/dashboard/instructor"
        class="text-sm text-slate-400 hover:text-white transition"
        >Exit Builder</a
      >
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-10 space-y-8">
      <div>
        <h1 class="text-2xl font-bold text-white">Create New Course</h1>
        <p class="text-slate-400 text-sm mt-1">
          Fill out the details below to publish your content.
        </p>
      </div>

      <!-- Step 1: Course Info Form -->
      <form
        id="courseForm"
        onsubmit="handleFormSubmit(event)"
        class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6"
      >
        <div class="space-y-4">
          <div>
            <label
              class="block text-xs font-semibold text-slate-400 uppercase mb-1"
              >Course Title *</label
            >
            <input
              id="c-title"
              type="text"
              placeholder="e.g. Master Fullstack Next.js"
              class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
              required
            />
            <p id="err-title" class="text-xs text-rose-400 mt-1 hidden">
              Course title is required.
            </p>
          </div>

          <div>
            <label
              class="block text-xs font-semibold text-slate-400 uppercase mb-1"
              >Description *</label
            >
            <textarea
              id="c-desc"
              rows="3"
              placeholder="Course overview..."
              class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-indigo-500 resize-none"
              required
            ></textarea>
            <p id="err-desc" class="text-xs text-rose-400 mt-1 hidden">
              Course description is required.
            </p>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label
                class="block text-xs font-semibold text-slate-400 uppercase mb-1"
                >Category</label
              >
              <select
                id="c-category"
                class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
              >
                <option value="Development">Development</option>
                <option value="Frontend">Frontend</option>
                <option value="Architecture">Architecture</option>
              </select>
            </div>
            <div>
              <label
                class="block text-xs font-semibold text-slate-400 uppercase mb-1"
                >Difficulty</label
              >
              <select
                id="c-difficulty"
                class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
              >
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
              </select>
            </div>
          </div>
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm text-white rounded-xl transition"
        >
          Create Course & Continue to Curriculum →
        </button>
      </form>

      <!-- Step 2: Module Management (Revealed after course creation) -->
      <div
        id="moduleSection"
        class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 hidden"
      >
        <h2 class="text-lg font-bold text-white">Add Curriculum Modules</h2>
        <div class="flex gap-2">
          <input
            id="m-title"
            type="text"
            placeholder="Module Title (e.g. Core Concepts)"
            class="flex-1 p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
          />
          <button
            type="button"
            onclick="addModule()"
            class="px-5 py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold text-xs text-white rounded-xl transition"
          >
            Add Module
          </button>
        </div>
        <div id="moduleList" class="space-y-3 pt-2"></div>
      </div>
    </main>

    <script>
      let activeCourseId = null;

      function showToast(message, isError = false) {
        const toast = document.getElementById("toast");
        const toastBody = document.getElementById("toast-body");
        const toastMsg = document.getElementById("toast-message");

        toastMsg.innerText = message;
        toastBody.className = isError
          ? "px-5 py-3 rounded-xl font-medium text-sm text-white shadow-xl bg-rose-600 flex items-center gap-3"
          : "px-5 py-3 rounded-xl font-medium text-sm text-white shadow-xl bg-emerald-600 flex items-center gap-3";

        toast.classList.remove("hidden");
        setTimeout(() => {
          toast.classList.add("hidden");
        }, 3500);
      }

      async function handleFormSubmit(event) {
        event.preventDefault();

        const title = document.getElementById("c-title").value.trim();
        const description = document.getElementById("c-desc").value.trim();
        const category = document.getElementById("c-category").value;
        const difficulty = document.getElementById("c-difficulty").value;

        let valid = true;
        if (!title) {
          document.getElementById("err-title").classList.remove("hidden");
          valid = false;
        } else {
          document.getElementById("err-title").classList.add("hidden");
        }

        if (!description) {
          document.getElementById("err-desc").classList.remove("hidden");
          valid = false;
        } else {
          document.getElementById("err-desc").classList.add("hidden");
        }

        if (!valid) return;

        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Creating Course...";

        try {
          const res = await fetch("/api/courses", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, description, category, difficulty }),
          });

          const data = await res.json();
          if (res.ok && data.status === "success") {
            activeCourseId = data.course_id;
            showToast("Course created! You can now add modules below.");
            document.getElementById("moduleSection").classList.remove("hidden");
            submitBtn.innerText = "✓ Course Base Created";
            submitBtn.className =
              "w-full py-3 bg-emerald-600 font-semibold text-sm text-white rounded-xl cursor-default";
          } else {
            showToast("Failed to create course.", true);
            submitBtn.disabled = false;
            submitBtn.innerText = "Create Course & Continue to Curriculum →";
          }
        } catch (err) {
          showToast("Network error occurred.", true);
          submitBtn.disabled = false;
          submitBtn.innerText = "Create Course & Continue to Curriculum →";
        }
      }

      async function addModule() {
        const titleInput = document.getElementById("m-title");
        const title = titleInput.value.trim();

        if (!title || !activeCourseId) {
          showToast("Please enter a module title.", true);
          return;
        }

        try {
          const res = await fetch(`/api/courses/${activeCourseId}/modules`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, order: 1 }),
          });

          const data = await res.json();
          if (data.status === "success") {
            showToast("Module added successfully!");
            const list = document.getElementById("moduleList");
            const item = document.createElement("div");
            item.className =
              "p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-300 font-medium flex justify-between items-center";
            item.innerHTML = `<span>📦 ${title}</span> <span class="text-indigo-400 text-[10px] bg-indigo-950 border border-indigo-800 px-2 py-0.5 rounded">Module #${data.module_id}</span>`;
            list.appendChild(item);
            titleInput.value = "";
          } else {
            showToast("Failed to add module.", true);
          }
        } catch (err) {
          showToast("Network error while adding module.", true);
        }
      }
    </script>
  </body>
</html>
