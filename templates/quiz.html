<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz: {{ quiz.title }} - SkillPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-12">
    <div class="max-w-2xl mx-auto space-y-6">
      <a
        href="/lessons/{{ lesson.id }}"
        class="text-xs text-indigo-400 hover:underline"
        >← Back to Lesson</a
      >

      <div>
        <span
          class="text-xs font-semibold uppercase tracking-wider text-indigo-400"
          >Knowledge Check</span
        >
        <h1 class="text-2xl font-bold mt-1">{{ quiz.title }}</h1>
      </div>

      <form
        action="/quizzes/{{ quiz.id }}/submit"
        method="POST"
        class="space-y-6"
      >
        {% for question in quiz.questions %}
        <div
          class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4"
        >
          <p class="font-medium text-sm text-slate-200">
            {{ loop.index }}. {{ question.prompt }}
          </p>

          <div class="space-y-2">
            {% for opt in question.options %}
            <label
              class="flex items-center gap-3 p-3 bg-slate-800/40 border border-slate-800 rounded-xl hover:bg-slate-800/80 cursor-pointer transition"
            >
              <input
                type="radio"
                name="question_{{ question.id }}"
                value="{{ opt.id }}"
                required
                class="accent-indigo-500"
              />
              <span class="text-xs text-slate-300">{{ opt.text }}</span>
            </label>
            {% endfor %}
          </div>
        </div>
        {% endfor %}

        <button
          type="submit"
          class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm rounded-xl transition shadow-lg"
        >
          Submit Quiz
        </button>
      </form>
    </div>
  </body>
</html>
